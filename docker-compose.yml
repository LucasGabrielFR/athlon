services:
  mysql:
    image: mysql:8.0
    container_name: athlon-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: athlon_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: athlon-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - .env

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: athlon-api
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://user:password@mysql:3306/athlon_db

volumes:
  mysql_data:
